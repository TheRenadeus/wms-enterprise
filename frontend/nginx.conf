# Si hay otro proxy delante (Caddy, Cloudflare), respeta el protocolo original.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_tokens off;

  # Las importaciones envían el Excel en el cuerpo (la API acepta hasta 20 MB).
  client_max_body_size 25m;

  location /api {
    proxy_pass http://wms-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Estado del servicio (para monitores externos y la app móvil).
  location = /health {
    proxy_pass http://wms-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
