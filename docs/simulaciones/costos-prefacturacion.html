<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Costos y Prefacturación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: el mismo armazón del WMS (barra lateral oscura + área de trabajo clara); el módulo nuevo "Comercial" usa esmeralda como color de sección. */
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --line:#e2e8f0; --line-2:#cbd5e1;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b;
  --side:#0f172a; --side-ink:#cbd5e1; --side-muted:rgba(255,255,255,.5); --side-hover:#1e293b; --side-line:#1e293b;
  --accent:#4f46e5; --accent-soft:#eef2ff; --accent-ink:#4338ca; --on-accent:#ffffff;
  --money:#059669; --money-soft:#ecfdf5; --money-ink:#047857; --on-money:#ffffff; --money-side:#34d399;
  --warn:#b45309; --warn-soft:#fffbeb; --bad:#dc2626; --bad-soft:#fef2f2;
  --sim:#f59e0b; --sim-soft:#fef3c7; --sim-ink:#92400e;
  --t-prod:#4f46e5; --t-ins:#c2410c; --t-tr:#0e7490; --t-srv:#6d28d9; --t-otr:#475569;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.05);
  --overlay:rgba(15,23,42,.55);
  --paper:#ffffff; --paper-ink:#0f172a;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#111a2e; --surface-2:#0f172a; --line:#1f2a44; --line-2:#334155;
  --ink:#e2e8f0; --ink-2:#cbd5e1; --muted:#94a3b8;
  --side:#020617; --side-ink:#cbd5e1; --side-muted:rgba(255,255,255,.45); --side-hover:#0f172a; --side-line:#1e293b;
  --accent:#818cf8; --accent-soft:rgba(99,102,241,.16); --accent-ink:#a5b4fc; --on-accent:#0b1120;
  --money:#34d399; --money-soft:rgba(16,185,129,.14); --money-ink:#6ee7b7; --on-money:#022c22; --money-side:#34d399;
  --warn:#fbbf24; --warn-soft:rgba(245,158,11,.14); --bad:#f87171; --bad-soft:rgba(239,68,68,.14);
  --sim:#f59e0b; --sim-soft:rgba(245,158,11,.16); --sim-ink:#fcd34d;
  --t-prod:#a5b4fc; --t-ins:#fb923c; --t-tr:#22d3ee; --t-srv:#c4b5fd; --t-otr:#94a3b8;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --overlay:rgba(2,6,23,.7);
  --paper:#f8fafc; --paper-ink:#0f172a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --surface-2:#0f172a; --line:#1f2a44; --line-2:#334155;
  --ink:#e2e8f0; --ink-2:#cbd5e1; --muted:#94a3b8;
  --side:#020617; --side-ink:#cbd5e1; --side-muted:rgba(255,255,255,.45); --side-hover:#0f172a; --side-line:#1e293b;
  --accent:#818cf8; --accent-soft:rgba(99,102,241,.16); --accent-ink:#a5b4fc; --on-accent:#0b1120;
  --money:#34d399; --money-soft:rgba(16,185,129,.14); --money-ink:#6ee7b7; --on-money:#022c22; --money-side:#34d399;
  --warn:#fbbf24; --warn-soft:rgba(245,158,11,.14); --bad:#f87171; --bad-soft:rgba(239,68,68,.14);
  --sim:#f59e0b; --sim-soft:rgba(245,158,11,.16); --sim-ink:#fcd34d;
  --t-prod:#a5b4fc; --t-ins:#fb923c; --t-tr:#22d3ee; --t-srv:#c4b5fd; --t-otr:#94a3b8;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --overlay:rgba(2,6,23,.7);
  --paper:#f8fafc; --paper-ink:#0f172a;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ── Armazón ── */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 32px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:900;letter-spacing:.02em;font-size:17px;padding:4px 8px 16px}
.brand svg{color:#818cf8}
.who{border-top:1px solid var(--side-line);border-bottom:1px solid var(--side-line);padding:12px 8px;margin-bottom:8px}
.who small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--side-muted);text-transform:uppercase}
.who b{display:block;color:#fff;font-size:13px;margin-top:4px}
.who i{font-style:normal;font-size:10px;font-weight:800;color:#a5b4fc;letter-spacing:.08em}
.nav-sec{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--side-muted);text-transform:uppercase;padding:14px 10px 6px;display:flex;align-items:center;gap:8px}
.nav-sec .new{margin-left:auto}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:transparent;color:var(--side-ink);cursor:pointer;text-align:left;font-size:14px;font-weight:500}
.nav-btn:hover{background:var(--side-hover)}
.nav-btn.ctx{opacity:.55}
.nav-btn.on{background:rgba(16,185,129,.18);color:var(--money-side);font-weight:800}
.nav-sep{border-top:1px solid var(--side-line);margin:8px 0}
.new{font-size:9px;font-weight:900;letter-spacing:.1em;background:#10b981;color:#022c22;padding:2px 6px;border-radius:999px;margin-left:auto}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:56px;padding-block:8px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
.topbar .wms{font-weight:900;letter-spacing:.16em;font-size:12px;color:var(--ink-2)}
.simchip{display:inline-flex;align-items:center;gap:6px;background:var(--sim-soft);color:var(--sim-ink);border:1px solid color-mix(in srgb,var(--sim) 40%,transparent);font-size:11px;font-weight:900;letter-spacing:.08em;padding:4px 10px;border-radius:8px;text-transform:uppercase}
.topbar .note{font-size:12px;color:var(--muted)}
.topbar .sp{flex:1}
.btn.menu-btn{display:none}
.content{padding-block:28px 72px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1440px;width:100%}
.scrim{display:none}

/* ── Encabezados ── */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head p{margin:6px 0 0;color:var(--muted);max-width:68ch;line-height:1.5}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent-ink);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:8px}

/* ── Piezas ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.card-b{padding:20px}
.scroll{overflow-x:auto}
.tabs{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:14px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab.on{background:var(--money);color:var(--on-money)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.kpi small{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.kpi b{display:block;font-size:24px;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hl{background:var(--money);border-color:var(--money);color:var(--on-money)}
.kpi.hl small,.kpi.hl span{color:inherit;opacity:.85}
.kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}

table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.t td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .num{text-align:right;white-space:nowrap}
.t .ctr{text-align:center}
.t td.code{white-space:nowrap}
.t tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.t .grp td{background:var(--surface-2);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 12px}
.code{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-2)}
.sub{font-size:12px;color:var(--muted)}
.in{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;width:100%;outline:none;min-width:0}
.in:focus{border-color:var(--accent)}
.in:disabled{background:var(--surface-2);color:var(--muted);border-color:transparent}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.in.money{width:120px}
.in.qty{width:84px}
.in.pct{width:64px}
.in.uom{width:76px;text-transform:uppercase}
select.in{padding-right:28px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fields .wide{grid-column:span 3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);padding:9px 14px;border-radius:12px;font-size:12px;font-weight:800;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--line-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.money{background:var(--money);border-color:var(--money);color:var(--on-money)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:11px}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px;cursor:pointer;display:inline-flex}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip.good{background:var(--money-soft);color:var(--money-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.mg{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.mg small{font-size:11px;color:var(--muted)}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;white-space:nowrap;background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--tc)}
.ty-producto{--tc:var(--t-prod)} .ty-insumo{--tc:var(--t-ins)} .ty-transporte{--tc:var(--t-tr)} .ty-servicio{--tc:var(--t-srv)} .ty-otro{--tc:var(--t-otr)}
.add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-btn{border:1.5px dashed color-mix(in srgb,var(--tc) 50%,transparent);color:var(--tc);background:color-mix(in srgb,var(--tc) 6%,transparent)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.note-box{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
.note-box.warn{background:var(--warn-soft);color:var(--warn)}
.note-box svg{flex:none;margin-top:1px}

/* ── Editor de prefactura ── */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.ed-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.ed-side{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
.lines td{padding:8px 8px}
.lines th{padding:10px 8px}
.c-item{min-width:260px}
.c-item .stack{display:flex;flex-direction:column;gap:6px}
.flag{display:block;font-size:10px;font-weight:900;color:var(--bad);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;text-align:right}
.internal{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.t th.internal{background:var(--accent-soft);color:var(--accent-ink)}
.origin{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.tot{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.tot .r{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tot .r .in{width:64px;padding:4px 8px}
.tot .r label{display:flex;align-items:center;gap:8px}
.tot .hr{border-top:1px dashed var(--line-2);margin:4px 0}
.tot .big{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.tot .big b{font-size:26px;letter-spacing:-.01em}
.tot .neto b{font-weight:800}
.intl{background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.intl .r{color:inherit}
.intl small{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.mix{display:flex;flex-direction:column;gap:8px}
.mix .bar{height:10px;border-radius:999px;background:var(--surface-2);display:flex;overflow:hidden}
.mix .bar span{display:block;height:100%;background:var(--tc)}
.mix ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12px}
.mix li{display:contents}
.mix .dot{display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--tc);margin-right:6px}
.alerts{display:flex;flex-direction:column;gap:6px;font-size:12px}
.alerts div{display:flex;gap:8px;align-items:flex-start;color:var(--warn)}
.alerts div.bad{color:var(--bad)}
.alerts div.ok{color:var(--money-ink)}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{width:100%}
.confirm{display:flex;flex-direction:column;gap:8px;border:1.5px solid color-mix(in srgb,var(--bad) 35%,transparent);background:var(--bad-soft);border-radius:12px;padding:12px;font-size:12px;color:var(--bad);font-weight:700}
.confirm .bar-row .btn{flex:1}
.steps{display:flex;gap:0;flex-wrap:wrap;margin-top:14px}
.step{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-right:14px}
.step i{font-style:normal;width:22px;height:22px;border-radius:999px;display:inline-grid;place-items:center;border:2px solid var(--line-2);font-size:11px}
.step.done{color:var(--money-ink)} .step.done i{background:var(--money);border-color:var(--money);color:var(--on-money)}
.step.cur{color:var(--ink)} .step.cur i{border-color:var(--accent);color:var(--accent-ink)}
.step + .step::before{content:"";width:22px;height:2px;background:var(--line-2);margin-right:8px}
.st{display:inline-flex}
.suggest{border-top:1px solid var(--line);background:color-mix(in srgb,var(--money-soft) 60%,transparent)}
.suggest .card-h{border-bottom:0;padding-bottom:8px}
.suggest .t td,.suggest .t th{background:transparent}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer}
.fchip.on{border-color:var(--ink-2);color:var(--ink);background:var(--surface-2)}
.link{background:none;border:0;color:var(--accent-ink);font-weight:800;cursor:pointer;padding:0;font-size:13px}
.pf-num{font-family:var(--mono);font-weight:800;font-size:12px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.fbar > svg{color:var(--muted);flex:none}
.fbar .in{width:auto;max-width:100%;padding-block:6px}
.fbar .toggle .in{padding-block:5px}
.search{position:relative;display:inline-flex;align-items:center;flex:1 1 220px;max-width:340px;min-width:0}
.search svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.fbar .search .in{width:100%;padding-left:34px}
.fcount{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kind-card{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.kind-card.sel{border-color:var(--money);box-shadow:0 0 0 1px var(--money)}
.kind-card h3{margin:0;font-size:15px;font-weight:900;display:flex;gap:8px;align-items:center}
.kind-card p{margin:0;line-height:1.45}
.kind-card .big{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.tr-note{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:3px}
.fields.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){ .kinds{grid-template-columns:minmax(0,1fr)} .fields.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .fields.four{grid-template-columns:minmax(0,1fr)} }

/* ── Vista previa (documento) ── */
.modal{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--paper);color:var(--paper-ink);width:100%;max-width:820px;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:40px 44px;position:relative}
.sheet .close{position:absolute;top:12px;right:12px;background:#f1f5f9;border:0;border-radius:10px;padding:8px;cursor:pointer;color:#0f172a;display:inline-flex}
.doc-top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:2px solid #0f172a;padding-bottom:18px}
.doc-top h2{margin:0;font-size:15px;font-weight:900;letter-spacing:.04em}
.doc-top .muted{color:#64748b;font-size:12px;line-height:1.6}
.doc-box{border:2px solid #b91c1c;color:#b91c1c;padding:12px 16px;text-align:center;font-weight:900;font-size:13px;letter-spacing:.04em;line-height:1.6;border-radius:4px}
.doc-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;font-size:12px;padding:16px 0;border-bottom:1px solid #e2e8f0;color:#334155}
.doc-meta b{color:#0f172a}
.doc-lines{width:100%;border-collapse:collapse;font-size:12px;margin-top:16px}
.doc-lines th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#64748b;border-bottom:1px solid #0f172a;padding:6px 6px}
.doc-lines td{padding:7px 6px;border-bottom:1px solid #e2e8f0;color:#0f172a}
.doc-lines .num{text-align:right;white-space:nowrap}
.doc-tot{margin-left:auto;margin-top:16px;width:min(300px,100%);font-size:13px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.doc-tot div{display:flex;justify-content:space-between}
.doc-tot .tt{border-top:2px solid #0f172a;padding-top:6px;margin-top:4px;font-weight:900;font-size:15px}
.doc-foot{margin-top:28px;font-size:11px;color:#64748b;line-height:1.6;border-top:1px solid #e2e8f0;padding-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}

/* ── Responsivo ── */
@media (max-width:1180px){
  .ed{grid-template-columns:minmax(0,1fr)}
  .ed-side{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;height:100%;transform:translateX(-100%);transition:transform .2s ease;padding-top:max(18px,env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:var(--overlay);z-index:25}
  .btn.menu-btn{display:inline-flex}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar .note{display:none}
}
@media (max-width:640px){
  .content{padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head h1{font-size:22px}
  .fields{grid-template-columns:minmax(0,1fr)}
  .fields .wide{grid-column:auto}
  .ed-side{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:28px 20px}
  .doc-meta{grid-template-columns:minmax(0,1fr)}
  .kpi b{font-size:20px}
}
</style>

// ─── Cálculos ─────────────────────────────────────────────────────────────
const lineGross = l => num(l.qty) * num(l.price);
const lineNet = l => Math.round(lineGross(l) * (1 - num(l.disc)/100));
const lineCost = l => num(l.qty) * num(l.cost);
function calc(pf){
  let afecto = 0, exento = 0, cost = 0; const byType = {};
  pf.lines.forEach(l => {
    const n = lineNet(l);
    if (l.afecto) afecto += n; else exento += n;
    cost += lineCost(l);
    byType[l.type] = (byType[l.type]||0) + n;
  });
  const g = Math.min(Math.max(num(pf.discount),0),100) / 100;
  const afectoN = Math.round(afecto*(1-g)), exentoN = Math.round(exento*(1-g));
  const discAmt = (afecto + exento) - (afectoN + exentoN);
  const iva = Math.round(afectoN * num(pf.ivaRate) / 100);
  const neto = afectoN + exentoN, total = neto + iva;
  const margin = neto - cost, marginPct = neto ? margin/neto*100 : 0;
  return { afecto, exento, afectoN, exentoN, discAmt, iva, neto, total, cost, margin, marginPct, byType };
}
const marginOf = (cost, price) => num(price) > 0 ? (num(price)-num(cost))/num(price)*100 : null;
function marginClass(m){ if (m === null) return 'warn'; if (m < D.minMargin) return 'bad'; if (m < D.minMargin + 10) return 'warn'; return 'good'; }
function issues(pf){
  const out = [];
  pf.lines.forEach((l,i) => {
    const name = l.desc || `línea ${i+1}`;
    if (num(l.price) <= 0) out.push({ lvl:'bad', msg:`${name}: sin precio` });
    else if (num(l.qty) <= 0) out.push({ lvl:'bad', msg:`${name}: cantidad en cero` });
    else if (num(l.cost) > 0 && lineNet(l) < lineCost(l)) out.push({ lvl:'bad', msg:`${name}: se cobra bajo el costo` });
    else if (num(l.cost) > 0) { const m = (lineNet(l)-lineCost(l))/lineNet(l)*100; if (m < D.minMargin) out.push({ lvl:'warn', msg:`${name}: margen ${pct(m)} (mínimo ${D.minMargin}%)` }); }
    if (!String(l.desc||'').trim()) out.push({ lvl:'bad', msg:`Línea ${i+1}: falta la descripción` });
  });
  return out;
}

function kpisPrecios(){
  const rows = preciosRows();

  const avg = priced.length ? priced.reduce((a,r) => a + marginOf(r.cost, r.price), 0)/priced.length : 0;
  const low = priced.filter(r => marginOf(r.cost, r.price) < D.minMargin).length;
  const none = rows.length - priced.length;
  const label = { productos:'productos', insumos:'insumos', servicios:'servicios' }[UI.preciosTab];
  return `

    <div class="kpi ${none?'warn':''}"><small>Sin precio definido</small><b>${none}</b><span>no se pueden prefacturar</span></div>`;

function newPfFromGuides(client, guides){

function newPf(client){

function pendingOf(c){
  if (c.kind === 'venta') {
    const gp = D.dispatches.filter(g => g.client === c.id && gdPending(g));
    return { n:gp.length, amount:gp.reduce((a,g) => a + gdAmount(g), 0), label: gp.length ? `${gp.length} guía${gp.length===1?'':'s'} sin cobrar` : '' };
  }
  const pf = periodPf(c.id, CUR_PERIOD);
  return pf ? { n:0, amount:0, label:'', pf } : { n:1, amount:suggestTotal(c.id), label:`${periodLabel(CUR_PERIOD)} sin prefacturar` };

  const what = c.kind === 'venta' ? 'productos y fletes' : 'servicios, fletes e insumos';
  return `${fbar([searchBox('spq', 'Buscar código o descripción'), chkF('spOnly', 'Solo con precio especial')], ['spq','spOnly'], rows.length, all.length)}
    <div class="scroll"><table class="t"><thead><tr><th>Código</th><th>Descripción</th><th>UM</th><th class="num">Costo</th><th class="num">Precio de lista</th><th class="num">Precio para ${esc(c.name)}</th><th class="num">Margen</th></tr></thead>
    <tbody>${body || emptyRow(7, 'spq,spOnly')}</tbody></table></div>
    <div class="card-b"><div class="note-box">${ic('info',18)}<span>Lista de ${what} para un cliente de ${KINDS[c.kind].short.toLowerCase()}. Deja el campo vacío para usar el precio de lista. El precio del cliente se aplica a las líneas nuevas; las prefacturas ya armadas mantienen su precio.</span></div></div>`;
}
function renderClientDetail(){
  const c = clientById(UI.clientId);
  const pfs = D.prefacturas.filter(p => p.client === c.id).sort((a,b) => b.num.localeCompare(a.num));
  const tabs = c.kind === 'venta'
    ? [['despachos',`Guías de despacho (${D.dispatches.filter(g => g.client === c.id).length})`], ['precios','Precios del cliente'], ['prefacturas',`Prefacturas (${pfs.length})`]]
    : [['servicios',`Cobros de ${periodLabel(CUR_PERIOD).toLowerCase()}`], ['precios','Tarifas del cliente'], ['prefacturas',`Prefacturas (${pfs.length})`]];
  if (!tabs.some(t => t[0] === UI.clientTab)) UI.clientTab = tabs[0][0];
  const tab = UI.clientTab;
  let body;
  if (tab === 'despachos') body = clientGuidesTab(c);
  else if (tab === 'servicios') body = clientServicesTab(c);
  else if (tab === 'precios') body = clientPricesTab(c);
  else body = `<div class="scroll"><table class="t"><thead><tr><th>N°</th><th>Período</th><th>Estado</th><th class="num">Neto</th><th class="num">Total</th><th></th></tr></thead><tbody>
      ${pfs.map(p => { const k = calc(p); const s = STATUS[p.status]; return `<tr><td class="pf-num">${esc(p.num)}</td><td>${periodLabel(p.period)}</td><td><span class="chip ${s.cls}">${s.label}</span></td><td class="num">${clp(k.neto)}</td><td class="num"><b>${clp(k.total)}</b></td><td class="num"><button class="btn sm" data-act="open" data-id="${p.id}">Abrir</button></td></tr>`; }).join('') || `<tr><td colspan="6"><div class="empty"><b>Sin prefacturas</b>${c.kind === 'venta' ? 'Selecciona guías pendientes y prefactúralas.' : 'Prefactura los cobros del mes desde la primera pestaña.'}</div></td></tr>`}
      </tbody></table></div>`;
  const third = c.kind === 'almacenaje'
    ? `<div class="field"><label>En bodega hoy</label><span>${c.stock.pos} posiciones · ${c.stock.skus} SKU · ${fmtN.format(c.stock.units)} unidades</span></div>`
    : `<div class="field"><label>Lista de precios</label><span>General${Object.keys(D.clientPrices[c.id] || {}).length ? ` + ${Object.keys(D.clientPrices[c.id]).length} precio(s) especial(es)` : ''}</span></div>`;
  return `
    <div class="head"><div style="min-width:0">
      <button class="back" data-act="cl-list">${ic('left',14)} Todos los clientes</button>
      <h1>${esc(c.name)} ${kindChip(c.kind)}</h1>
      <p>RUT ${esc(c.rut)} · ${esc(c.giro)}. ${KINDS[c.kind].desc}.</p>
    </div></div>
    <div class="card"><div class="card-b fields four">
      <div class="field"><label>Dirección de facturación</label><span>${esc(c.dir)}</span></div>
      <div class="field"><label>Contacto</label><span>${esc(c.contact)} · ${esc(c.email)}</span></div>
      <div class="field"><label>Condición de pago</label><span>${termsLabel(c.terms)}</span></div>
      ${third}
    </div></div>
    <div class="tabs" role="tablist" style="align-self:flex-start">${tabs.map(([id,l]) => `<button class="tab ${tab===id?'on':''}" role="tab" aria-selected="${tab===id}" data-act="ctab" data-tab="${id}">${l}</button>`).join('')}</div>
    <div class="card">${body}</div>`;
}

// ─── Vista previa del documento ──────────────────────────────────────────
function renderPreview(){
  const pf = currentPf(); if (!pf) return;
  const c = calc(pf), cl = clientById(pf.client);
  const terms = pf.terms === '0' ? 'Contado' : `${pf.terms} días`;
  $('#modal').innerHTML = `<div class="modal" data-act="close-bg" role="dialog" aria-modal="true" aria-label="Vista previa de la prefactura">
    <div class="sheet">
      <button class="close" data-act="close" aria-label="Cerrar vista previa">${ic('x',18)}</button>
      <div class="doc-top">
        <div><h2>OPERADOR LOGÍSTICO (TU EMPRESA)</h2><div class="muted">Servicios de almacenaje, distribución y transporte<br>Bodega Central · Av. Américo Vespucio 1501, Quilicura</div></div>
        <div class="doc-box">PREFACTURA<br>N° ${esc(pf.num)}<br><span style="font-size:10px;font-weight:700">DOCUMENTO SIN VALOR TRIBUTARIO</span></div>
      </div>
      <div class="doc-meta">
        <div><b>Señor(es):</b> ${esc(cl.name)}</div><div><b>Fecha:</b> ${dateLabel(pf.date)}</div>
        <div><b>RUT:</b> ${esc(cl.rut)}</div><div><b>Período:</b> ${periodLabel(pf.period)}</div>
        <div><b>Giro:</b> ${esc(cl.giro)}</div><div><b>Condición de pago:</b> ${terms}</div>
        <div><b>Dirección:</b> ${esc(cl.dir)}</div><div><b>Referencia:</b> ${esc(pf.ref || '—')}</div>
      </div>
      <div style="overflow-x:auto"><table class="doc-lines"><thead><tr><th>Descripción</th><th class="num">Cant.</th><th>UM</th><th class="num">P. unitario</th><th class="num">Desc.</th><th class="num">Total</th></tr></thead>
      <tbody>${pf.lines.map(l => `<tr><td>${esc(l.desc)}${l.afecto ? '' : ' <span style="color:#64748b">(exento)</span>'}</td><td class="num">${qtyf(l.qty)}</td><td>${esc(l.uom)}</td><td class="num">${clp(l.price)}</td><td class="num">${num(l.disc) ? pct(l.disc) : ''}</td><td class="num">${clp(lineNet(l))}</td></tr>`).join('')}</tbody></table></div>
      <div class="doc-tot">
        ${c.discAmt ? `<div><span>Descuento global (${pct(pf.discount)})</span><span>− ${clp(c.discAmt)}</span></div>` : ''}
        <div><span>Monto neto</span><span>${clp(c.afectoN)}</span></div>
        <div><span>Monto exento</span><span>${clp(c.exentoN)}</span></div>
        <div><span>IVA (${pct(pf.ivaRate)})</span><span>${clp(c.iva)}</span></div>
        <div class="tt"><span>TOTAL</span><span>${clp(c.total)}</span></div>
      </div>
      ${pf.notes ? `<div class="doc-foot"><b>Observaciones:</b> ${esc(pf.notes)}</div>` : ''}
      <div class="doc-foot">Esta prefactura es un detalle previo para revisión del cliente. Una vez aprobada se emite la factura electrónica correspondiente (DTE 33, o DTE 34 si todo el cobro es exento).</div>
    </div></div>`;
  $('.modal .close').focus();
}

// ─── Render principal ────────────────────────────────────────────────────
function render(){
  // Conserva el foco (y el cursor en las búsquedas) al volver a dibujar.
  const ae = document.activeElement, fid = ae && ae.id; let s0 = null, s1 = null;
  try { if (ae && ae.type === 'search') { s0 = ae.selectionStart; s1 = ae.selectionEnd; } } catch(e){}
  renderSide();
  $('#menuBtn').innerHTML = ic('menu',18);
  $('#resetBtn').innerHTML = `${ic('refresh',14)} Restablecer simulación`;
  const v = $('#view');
  if (UI.view === 'precios') v.innerHTML = renderPrecios();
  else if (UI.view === 'clientes') v.innerHTML = renderClientes();
  else v.innerHTML = UI.pfId ? renderEditor() : renderPfList();
  if (fid) { const el = document.getElementById(fid); if (el && el !== document.activeElement) { el.focus({ preventScroll:true }); try { if (s0 !== null) el.setSelectionRange(s0, s1); } catch(e){} } }
}

// ─── Acciones ────────────────────────────────────────────────────────────
function newLine(type){
  const pf = currentPf();
  const cat = catalog(D, type, pf.client);
  const it = cat[0];
  return { id:uid(), type, key: it ? it.key : '', desc: it ? it.desc : '', uom: it ? it.uom : 'GL', qty:1, price: it ? it.price : 0, cost: it ? it.cost : 0, disc:0, afecto:true, origin:'' };
}
function go(view){ if (view === 'clientes') UI.clientId = null; UI.view = view; UI.sideOpen = false; UI.confirmVoid = false; if (location.hash !== '#'+view) history.replaceState(null, '', '#'+view); render(); window.scrollTo(0,0); }
function setStatus(st, msg){ const pf = currentPf(); pf.status = st; UI.confirmVoid = false; UI.suggestOpen = false; save(); render(); toast(msg); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'close-bg' && e.target !== b) return;
  const pf = currentPf();
  switch(a){
    case 'go': go(b.dataset.view); break;
    case 'ctx': toast('Esta simulación solo incluye la sección Comercial.', 'info'); break;
    case 'ptab': UI.preciosTab = b.dataset.tab; UI.F.pCat = ''; render(); break;
    case 'bulk': {
      const m = Math.min(Math.max(num(UI.bulkMargin),1),90)/100; let n = 0;
      preciosRows().forEach(r => {
        const src = D[r._k][r._i]; const cur = marginOf(src.cost, src.price);
        const apply = UI.bulkScope === 'todos' || (UI.bulkScope === 'sin-precio' && !num(src.price)) || (UI.bulkScope === 'bajo' && cur !== null && cur < D.minMargin);
        if (apply && num(src.cost) > 0) { src.price = roundUp10(src.cost/(1-m)); n++; }
      });
      save(); render(); toast(n ? `Precio recalculado en ${n} fila${n===1?'':'s'}` : 'No había filas que cumplieran la condición', n ? 'check' : 'info'); break;
    }
    case 'pff': UI.pfFilter = b.dataset.f; render(); break;
    case 'clr': clearF(b.dataset.keys.split(',')); render(); break;
    case 'ltype': UI.F.lType = b.dataset.t; render(); break;
    case 'open': if (UI.view !== 'prefacturacion') { UI.view = 'prefacturacion'; history.replaceState(null, '', '#prefacturacion'); } UI.pfId = b.dataset.id; UI.F.lType = ''; UI.gdOpen = false; UI.gdSel = {}; UI.suggestOpen = false; UI.confirmVoid = false; UI.suggestSel = {}; render(); window.scrollTo(0,0); break;
    case 'list': UI.pfId = null; UI.confirmVoid = false; render(); window.scrollTo(0,0); break;
    case 'new': {
      if (!UI.newClient) { toast('Elige primero el cliente de la prefactura.', 'info'); $('#newClient')?.focus(); break; }
      const np = newPf(UI.newClient), venta = kindOf(UI.newClient) === 'venta';
      UI.pfId = np.id; UI.newClient = ''; UI.F.lType = ''; UI.gdOpen = venta; UI.suggestOpen = !venta; UI.gdSel = {}; UI.suggestSel = {}; save(); render(); toast('Prefactura creada en borrador'); break;
    }
    case 'add': UI.F.lType = ''; pf.lines.push(newLine(b.dataset.type)); save(); render(); { const last = pf.lines[pf.lines.length-1]; const el = document.getElementById('lq-'+last.id); if (el) { el.focus(); el.select(); } } break;
    case 'del-line': { const id = b.closest('[data-line]').dataset.line; pf.lines = pf.lines.filter(l => l.id !== id); syncGd(pf); save(); render(); toast('Línea quitada', 'trash'); break; }
    case 'sg-open': UI.suggestOpen = true; UI.gdOpen = false; UI.suggestSel = {}; render(); break;
    case 'gd-open': UI.gdOpen = true; UI.suggestOpen = false; UI.gdSel = {}; render(); break;
    case 'gd-close': UI.gdOpen = false; render(); break;
    case 'gd-add': {
      const gs = D.dispatches.filter(g => g.client === pf.client && gdPending(g) && (UI.gdSel[g.id] ?? true));
      let n = 0; gs.forEach(g => { const ls = gdLines(g); pf.lines.push(...ls); n += ls.length; g.pf = pf.id; });
      UI.gdOpen = false; UI.gdSel = {}; UI.F.lType = ''; save(); render(); toast(`${gs.length} guía${gs.length===1?'':'s'} agregada${gs.length===1?'':'s'} (${n} línea${n===1?'':'s'})`); break;
    }
    case 'cl-open': UI.clientId = b.dataset.id; UI.clientTab = kindOf(b.dataset.id) === 'venta' ? 'despachos' : 'servicios'; UI.clientGdSel = {}; clearF(['gq','gState','gFrom','gTo','spq','spOnly','svq','svType']); render(); window.scrollTo(0,0); break;
    case 'cl-list': UI.clientId = null; render(); window.scrollTo(0,0); break;
    case 'ctab': UI.clientTab = b.dataset.tab; render(); break;
    case 'ckind': UI.F.cKind = b.dataset.k; render(); break;
    case 'cl-period': {
      const cid = UI.clientId, rows = suggestRows(cid);
      if (!rows.length || periodPf(cid, CUR_PERIOD)) break;
      const np = newPf(cid);
      rows.forEach(s => np.lines.push({ id:uid(), type:s.type, key:s.key, desc:s.it.desc, uom:s.it.uom, qty:s.qty, price:s.it.price, cost:s.it.cost, disc:0, afecto:true, origin:s.origin }));
      UI.view = 'prefacturacion'; history.replaceState(null, '', '#prefacturacion');
      UI.pfId = np.id; UI.F.lType = ''; UI.gdOpen = false; UI.suggestOpen = false; UI.confirmVoid = false;
      save(); render(); window.scrollTo(0,0); toast(`${np.num} creada con ${rows.length} cobros de ${periodLabel(CUR_PERIOD).toLowerCase()}`); break;
    }
    case 'cgd-all': filteredGuides(UI.clientId).filter(gdPending).forEach(g => { UI.clientGdSel[g.id] = true; }); render(); break;
    case 'cl-prefact': {
      const gs = filteredGuides(UI.clientId).filter(g => gdPending(g) && UI.clientGdSel[g.id]);
      if (!gs.length) break;
      const np = newPfFromGuides(UI.clientId, gs);
      UI.clientGdSel = {}; UI.view = 'prefacturacion'; history.replaceState(null, '', '#prefacturacion');
      UI.pfId = np.id; UI.gdOpen = false; UI.suggestOpen = false; UI.confirmVoid = false;
      save(); render(); window.scrollTo(0,0); toast(`${np.num} creada con ${gs.length} guía${gs.length===1?'':'s'} de despacho`); break;
    }
    case 'sg-close': UI.suggestOpen = false; render(); break;
    case 'sg-add': {
      const already = s => pf.lines.some(l => l.type === s.type && l.key === s.key);
      let n = 0;
      (SUGGEST[pf.client] || []).forEach((s,i) => {
        const on = UI.suggestSel[i] ?? !already(s); const it = findItem(D, s.type, s.key, pf.client);
        if (on && it) { pf.lines.push({ id:uid(), type:s.type, key:s.key, desc:it.desc, uom:it.uom, qty:s.qty, price:it.price, cost:it.cost, disc:0, afecto:true, origin:s.origin }); n++; }
      });
      UI.suggestOpen = false; UI.suggestSel = {}; UI.F.lType = ''; save(); render(); toast(`${n} línea${n===1?'':'s'} agregada${n===1?'':'s'} desde el WMS`); break;
    }
    case 'save': save(); toast('Borrador guardado'); break;
    case 'to-review': {
      const bad = issues(pf).filter(i => i.lvl === 'bad');
      if (!pf.lines.length) { toast('Agrega al menos una línea antes de enviarla.', 'alert'); break; }
      if (bad.length) { toast(`Corrige ${bad.length} observación${bad.length===1?'':'es'} marcada${bad.length===1?'':'s'} en rojo antes de enviarla.`, 'alert'); break; }
      setStatus('EN_REVISION', 'Enviada a revisión'); break;
    }
    case 'to-draft': setStatus('BORRADOR', 'Devuelta a borrador'); break;
    case 'to-review-back': setStatus('EN_REVISION', 'Devuelta a revisión'); break;
    case 'approve': setStatus('APROBADA', 'Prefactura aprobada'); break;
    case 'invoice': {
      const c = calc(pf);
      pf.invoice = { num: D.nextInvoice++, dte: c.afectoN === 0 && c.exentoN > 0 ? 34 : 33 };
      setStatus('FACTURADA', `Factura N° ${pf.invoice.num} emitida (simulada)`); break;
    }
    case 'void': UI.confirmVoid = true; render(); break;
    case 'void-no': UI.confirmVoid = false; render(); break;
    case 'void-yes': { const had = D.dispatches.some(g => g.pf === pf.id); D.dispatches.forEach(g => { if (g.pf === pf.id) g.pf = null; }); setStatus('ANULADA', had ? 'Prefactura anulada. Sus guías de despacho quedan pendientes de cobro.' : 'Prefactura anulada'); break; }
    case 'dup': {
      const n = D.nextPf++; const id = 'pf' + n + uid();
      const [y,m] = pf.period.split('-').map(Number); const nm = m === 12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
      D.prefacturas.push({ ...JSON.parse(JSON.stringify(pf)), id, num:`PF-2026-${String(n).padStart(4,'0')}`, status:'BORRADOR', invoice:null, period: pf.status === 'FACTURADA' ? nm : pf.period, date:'2026-10-28', lines: pf.lines.filter(l => !l.gd).map(l => ({...l, id:uid(), origin:''})) });
      UI.pfId = id; save(); render(); window.scrollTo(0,0); toast('Copia creada en borrador'); break;
    }
    case 'preview': renderPreview(); break;
    case 'close': case 'close-bg': $('#modal').innerHTML = ''; break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.filter && t.type === 'search') { UI.F[t.dataset.filter] = t.value; render(); return; }
  // Costos y precios
  if (t.dataset.pk) {
    const r = D[t.dataset.pk][+t.dataset.pi]; r[t.dataset.pf] = num(t.value);
    const k = `${t.dataset.pk}-${t.dataset.pi}`;
    const mc = document.querySelector(`[data-m="${k}"]`); if (mc) mc.innerHTML = marginCell(r.cost, r.price);
    const iv = document.querySelector(`[data-iva="${k}"]`); if (iv) iv.textContent = num(r.price) ? clp(num(r.price)*1.19) : '—';
    $('#kpis').innerHTML = kpisPrecios(); save(); return;
  }
  if (t.id === 'minMargin') { D.minMargin = num(t.value); $('#kpis').innerHTML = kpisPrecios(); preciosRows().forEach(r => { const mc = document.querySelector(`[data-m="${r._k}-${r._i}"]`); if (mc) mc.innerHTML = marginCell(r.cost, r.price); }); save(); return; }
  if (t.id === 'bulkMargin') { UI.bulkMargin = num(t.value); return; }
  if (t.dataset.sp !== undefined && UI.clientId) {
    const cp = D.clientPrices[UI.clientId] = D.clientPrices[UI.clientId] || {};
    if (num(t.value) > 0) cp[t.dataset.sp] = num(t.value); else delete cp[t.dataset.sp];
    const cell = document.querySelector(`[data-spm="${t.dataset.sp}"]`); if (cell) cell.innerHTML = spMarginHtml(t.dataset.sp, UI.clientId, t.dataset.spt);
    save(); return;
  }
  // Prefactura: encabezado
  const pf = currentPf();
  if (t.dataset.hf && pf) {
    const f = t.dataset.hf;
    if (f === 'client') return; // se maneja en change
    pf[f] = (f === 'discount' || f === 'ivaRate') ? num(t.value) : t.value;
    save(); refreshFigures(); return;
  }
  // Prefactura: líneas
  if (t.dataset.lf && pf) {
    const row = t.closest('[data-line]'); const l = pf.lines.find(x => x.id === row.dataset.line); if (!l) return;
    const f = t.dataset.lf;
    if (f === 'key' || f === 'afecto') return; // se manejan en change
    l[f] = (f === 'qty' || f === 'price' || f === 'disc') ? num(t.value) : t.value;
    row.querySelector('[data-sub]').innerHTML = `<b>${clp(lineNet(l))}</b>`;
    const mg = row.querySelector('[data-mg]'); if (mg) mg.innerHTML = lineMarginHtml(l);
    const fl = row.querySelector('[data-flag]'); if (fl) fl.hidden = !(num(l.cost) > 0 && num(l.price) > 0 && lineNet(l) < lineCost(l));
    save(); refreshFigures();
  }
});

document.addEventListener('change', e => {
  const t = e.target; const pf = currentPf();
  if (t.dataset.filter) { if (t.type === 'search') return; UI.F[t.dataset.filter] = t.type === 'checkbox' ? t.checked : t.value; render(); return; }
  if (t.id === 'bulkScope') { UI.bulkScope = t.value; return; }
  if (t.id === 'newClient') { UI.newClient = t.value; return; }
  if (t.id === 'showCosts') { UI.showCosts = t.checked; render(); return; }
  if (t.dataset.sg !== undefined) { UI.suggestSel[+t.dataset.sg] = t.checked; render(); return; }
  if (t.dataset.gd !== undefined) { UI.gdSel[t.dataset.gd] = t.checked; render(); return; }
  if (t.dataset.cgd !== undefined) { UI.clientGdSel[t.dataset.cgd] = t.checked; render(); return; }
  if (t.dataset.hf === 'client' && pf) { pf.lines = pf.lines.filter(l => !l.gd); syncGd(pf); pf.client = t.value; pf.terms = clientById(pf.client).terms; UI.suggestOpen = false; UI.gdOpen = false; UI.suggestSel = {}; UI.gdSel = {}; save(); render(); toast(`Cliente cambiado a ${clientById(pf.client).name}. Se quitaron las líneas de guías del cliente anterior.`, 'info'); return; }
  if (t.dataset.lf && pf) {
    const row = t.closest('[data-line]'); const l = pf.lines.find(x => x.id === row.dataset.line); if (!l) return;
    if (t.dataset.lf === 'key') {
      const it = findItem(D, l.type, t.value, pf.client); l.key = t.value;
      if (it) { l.desc = it.desc; l.uom = it.uom; l.price = it.price; l.cost = it.cost; }
      save(); render(); return;
    }
    if (t.dataset.lf === 'afecto') { l.afecto = t.checked; save(); refreshFigures(); return; }
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal').innerHTML) $('#modal').innerHTML = ''; else if (UI.sideOpen) { UI.sideOpen = false; renderSide(); } } });
$('#menuBtn').addEventListener('click', () => { UI.sideOpen = !UI.sideOpen; renderSide(); });
$('#scrim').addEventListener('click', () => { UI.sideOpen = false; renderSide(); });
$('#resetBtn').addEventListener('click', () => { D = seed(); save(); UI.pfId = 'pf48'; UI.pfFilter = 'TODAS'; UI.suggestOpen = false; UI.gdOpen = false; UI.gdSel = {}; UI.clientGdSel = {}; UI.confirmVoid = false; UI.F = { ...F0 }; render(); toast('Simulación restablecida con los datos de ejemplo', 'refresh'); });
window.addEventListener('hashchange', () => { readHash(); render(); });

readHash();
if (!currentPf()) UI.pfId = null;
render();
})();
</script>
